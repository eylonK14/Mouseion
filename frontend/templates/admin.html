{% extends "base.html" %}

{% block title %}Admin · Mouseion{% endblock %}

{% block body %}
<main class="mx-auto max-w-6xl px-3 py-5 sm:px-5">
  <div class="mb-5 flex items-end justify-between gap-3">
    <div><h1 class="text-xl font-semibold">Operations</h1><p class="muted mt-1 text-sm">Health, jobs, pairing, and QA usage.</p></div>
    <a href="/" class="btn">Library</a>
  </div>
  <div id="admin-panel" hx-get="/ui/admin" hx-trigger="load, mouseion:auth from:body, mouseion:admin from:body" hx-swap="innerHTML">
    <div class="panel p-5 muted">Loading operational status…</div>
  </div>
</main>
{% endblock %}
