{% extends "base.html" %}

{% block title %}Pair this device · Mouseion{% endblock %}
{% block body_attrs %}data-pairing-page="true"{% endblock %}
{% block head %}<script src="/static/pair.js"></script>{% endblock %}

{% block body %}
<main class="mx-auto flex min-h-[calc(100vh-57px)] max-w-lg items-center px-4 py-8">
  <section class="panel w-full p-6 text-center">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-sky-400/10 text-2xl text-sky-300">◈</div>
    <h1 class="text-xl font-semibold">Pairing this device</h1>
    <p id="pair-status" class="muted mt-2 text-sm" aria-live="polite">
      Exchanging the one-time link securely…
    </p>
    <p id="pair-error" class="mt-3 hidden text-sm text-red-300" role="alert"></p>
    <a id="pair-home" href="/" class="btn mt-5 hidden justify-center">Back to Mouseion</a>
  </section>
</main>
{% endblock %}
