<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Mouseion is offline</title>
    <style>
      :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #0d0d0d; color: #ececec; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 28rem; padding: 1.5rem; border: 1px solid #2a2a2a; border-radius: .75rem; background: #171717; }
      p { color: #aaa; line-height: 1.55; } a { color: #7dd3fc; }
    </style>
  </head>
  <body>
    <main>
      <h1>Mouseion is offline</h1>
      <p>Your library server cannot be reached. Reconnect to your tailnet, then try again. Shared items stay on this device until you submit them.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
